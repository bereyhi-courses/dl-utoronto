# Site settings
course_name: Applied Deep Learning
course_description: "The key goal of this course is to provide a fundamental understanding on Computational Learning, its functionality, and its deployment towards building information processing units. These concepts are keys to Deep Learning and its Applications. The course is designed to give a good mixture of fundamental notions and hands-on skills by teaching both theory of deep learning and recent advances in this area. This course takes a fundamentally different approach to machine learning compared to ECE1513."
course_semester: "Fall 2026"


assgn_mark: 40%
assgn_desc: "4 assignment sets"
assgn_txt: "No need to say that this is the most important part! We are learning Deep Learning. This means that we should get our hands dirty and implement whatever we learn. There will be five set of assignments. The first one goes through basics and make you get into the mood of the course. The next four go through MLPs, CNNs, Transformers, and Autoencoding. There will be also some optional items for self-practice."

exam_mark: 30%
exam_desc: "Exam"
exam_txt: "We have two in-term exams in this semester. The exams are on <em>Friday, October 16</em> and <em>Friday, November 27.</em> Each exam will ask two questions similar to what you have seen in assignments, tutorials, and practice questions shared with you. The exam evaluates the understanding of fundamental concepts."

project_mark: 30%
project_desc: "open-ended"
project_txt: "Each group suggests its own problem that is to be solved by Deep Learning. Each group will then work on the project through the semester and present its final result at the end in a report and a short presentation. The group should complete the project and documentation through a Git Repository that is shared with their supervisor and the instructor."


